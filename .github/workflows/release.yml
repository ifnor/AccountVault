name: Release & Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（例如 v1.0.0，为空则自动读取 package.json）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ==================== 1. Windows Desktop & Browser Extension ====================
  build-windows:
    name: Build Windows (x64) & Browser Extension
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build Tauri Desktop (Windows x64)
        run: npm run tauri build

      - name: Prepare Windows & Browser Extension artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts"

          # 1. NSIS Setup installer
          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName -Destination "artifacts/AccountVault_Setup.exe"
          }

          # 2. Standalone portable executable
          $portable = "src-tauri/target/release/account-vault.exe"
          if (Test-Path $portable) {
            Copy-Item $portable -Destination "artifacts/AccountVault_Portable.exe"
          }

          # 3. Browser Extension ZIP
          Compress-Archive -Path "browser-extension/*" -DestinationPath "artifacts/AccountVault_Browser_Extension.zip" -Force

          # 4. Browser Extension CRX3 (packed via pre-installed Edge/Chrome)
          $browserExe = @(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($browserExe) {
            $extPath = (Resolve-Path "browser-extension").Path
            $pemPath = "src-tauri/certs/browser-extension.pem"
            if (Test-Path $pemPath) {
              $resolvedPem = (Resolve-Path $pemPath).Path
              & $browserExe --pack-extension="$extPath" --pack-extension-key="$resolvedPem" --no-message-box
            } else {
              & $browserExe --pack-extension="$extPath" --no-message-box
            }
            Start-Sleep -Seconds 2
            if (Test-Path "browser-extension.crx") {
              Move-Item -Force "browser-extension.crx" "artifacts/AccountVault_Browser_Extension.crx"
            }
            if (Test-Path "browser-extension.pem") {
              Remove-Item -Force "browser-extension.pem" -ErrorAction SilentlyContinue
            }
          }

      - name: Sign Windows executables (Authenticode)
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          $cert = "src-tauri/certs/ifnor.pfx"
          if ($signtool -and (Test-Path $cert)) {
            if (Test-Path "artifacts/AccountVault_Setup.exe") {
              & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p ifnor2026 "artifacts/AccountVault_Setup.exe"
            }
            if (Test-Path "artifacts/AccountVault_Portable.exe") {
              & $signtool sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $cert /p ifnor2026 "artifacts/AccountVault_Portable.exe"
            }
          }

      - name: Upload Windows & Extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-and-extension-binaries
          path: artifacts/*
          retention-days: 1

  # ==================== 2. Android Mobile (arm64-v8a) ====================
  build-android:
    name: Build Android (arm64-v8a, API 36)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Configure NDK Environment for Rust & bundled SQLite3
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN_BIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$TOOLCHAIN_BIN/aarch64-linux-android24-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=$TOOLCHAIN_BIN/llvm-ar" >> $GITHUB_ENV
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Make Gradle Wrapper Executable
        run: chmod +x src-tauri/gen/android/gradlew

      - name: Install dependencies
        run: |
          npm config set registry https://registry.npmjs.org/
          npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Android APK
        run: npx tauri android build --apk -t aarch64

      - name: Prepare Android artifact
        run: |
          mkdir -p artifacts
          APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" artifacts/AccountVault.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: artifacts/*
          retention-days: 1

  # ==================== 3. Create & Publish GitHub Release ====================
  publish-release:
    name: Create & Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

      - name: Generate Changelog & Release Notes
        id: changelog
        run: |
          git fetch --tags --force || true
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG..HEAD" --pretty=format:"* %s" --no-merges)
          else
            COMMITS=$(git log -n 15 --pretty=format:"* %s" --no-merges)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="* 性能优化与安全细节改进"
          fi

          TAG="${{ steps.tag.outputs.RELEASE_TAG }}"
          {
            echo "### 🚀 本次更新内容"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "---"
            echo ""
            echo "### 📦 安装包下载指南"
            echo ""
            echo "| 平台 / 类型 | 文件名 | 说明 |"
            echo "| :--- | :--- | :--- |"
            echo "| **Windows 安装版** | \`AccountVault_${TAG}_Setup.exe\` | NSIS 安装包（推荐） |"
            echo "| **Windows 便携版** | \`AccountVault_${TAG}_Portable.exe\` | 单文件免安装版 |"
            echo "| **Android 移动端** | \`AccountVault_${TAG}_Android_arm64.apk\` | Android 16+ (\`arm64-v8a\`) |"
            echo "| **浏览器扩展 (CRX)** | \`AccountVault_${TAG}_Browser_Extension.crx\` | Chrome / Edge 开发者模式拖入安装 |"
            echo "| **浏览器扩展 (ZIP)** | \`AccountVault_${TAG}_Browser_Extension.zip\` | 解压后通过“加载已解压的扩展程序”安装 |"
          } > release_body.md

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Rename assets with version tag & Generate SHA256 Checksums
        run: |
          cd release-assets
          TAG="${{ steps.tag.outputs.RELEASE_TAG }}"
          [ -f "AccountVault_Setup.exe" ] && mv "AccountVault_Setup.exe" "AccountVault_${TAG}_Setup.exe"
          [ -f "AccountVault_Portable.exe" ] && mv "AccountVault_Portable.exe" "AccountVault_${TAG}_Portable.exe"
          [ -f "AccountVault.apk" ] && mv "AccountVault.apk" "AccountVault_${TAG}_Android_arm64.apk"
          [ -f "AccountVault_Browser_Extension.zip" ] && mv "AccountVault_Browser_Extension.zip" "AccountVault_${TAG}_Browser_Extension.zip"
          [ -f "AccountVault_Browser_Extension.crx" ] && mv "AccountVault_Browser_Extension.crx" "AccountVault_${TAG}_Browser_Extension.crx"
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.RELEASE_TAG }}
          name: "账号管家 (Account Vault) ${{ steps.tag.outputs.RELEASE_TAG }}"
          body_path: release_body.md
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
