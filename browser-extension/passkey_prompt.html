<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AccountVault 通行密钥</title>
  <link rel="stylesheet" href="passkey_prompt.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <img src="icons/icon128.png" alt="AccountVault" class="logo" />
      <div class="header-text">
        <div id="prompt-title" class="title">AccountVault 通行密钥</div>
        <div id="prompt-subtitle" class="subtitle">正在加载请求...</div>
      </div>
    </header>

    <div id="info-card" class="info-card"></div>
    <div id="passkey-list" class="passkey-list hidden"></div>

    <footer class="footer">
      <button id="fallback-btn" type="button" class="btn secondary">改用系统原生</button>
      <button id="confirm-btn" type="button" class="btn primary hidden">使用 AccountVault 保存</button>
    </footer>
  </div>
  <script src="passkey_prompt.js"></script>
</body>
</html>
